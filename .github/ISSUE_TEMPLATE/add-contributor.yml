name: Add contributor
description: Track a contributor wall entry
title: "Add me to First Commit"
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: "Welcome! Follow the contribution guide and add your own JSON file to the contributors/ folder."
  - type: textarea
    id: checklist
    attributes:
      label: Contribution checklist
      value: "- [ ] I created my own file inside contributors/ named username.json\n- [ ] I used my correct GitHub username\n- [ ] I opened a pull request"
    validations:
      required: true
